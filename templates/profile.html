{% extends 'layout.html' %}

{% block title %}
    Profile
{% endblock %}

{% block content %}
    <div class="heading">
        <h1 class="display-1">
            Hello {{user.username}}!
        </h1>
        <div class="profile-pic">
            <img src="https://api.dicebear.com/6.x/lorelei/svg?seed={{ user.username }}" alt="">
        </div>
    </div>

    <!--form to change password and username-->
    <form action="" method="post" class="form">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" name="username" id="username" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label for="text" class="form-label">New Name</label>
            <input type="name" class="form-control" name="name" id="name" value="{{ user.name }}">
        </div>
        <div class="form-group">
            <label for="current_password" class="form-label">Current Password</label>
            <input type="password" class="form-control" name="current_password" id="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password" class="form-label">New Password</label>
            <input type="password" class="form-control" name="new_password" id="new_password">
        </div><br>
        <input type="submit" value="Update" class="btn btn-primary">
    </form>
{% endblock %}

{% block style %}

<style>
    .heading{
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .profile-pic{
        width: 90px;
        height: 90px;
        border: 3px solid purple;
        border-radius: 50%;
        overflow: hidden;
    }
</style>

{% endblock %}
