{% extends 'layout.html' %}

{% block title %}
    Edit Parking Lot
{% endblock %}

{% block content %}

<h1 class="display-1">Edit Parking Lot Information</h1>

    <form action="" class="form" method="post">
        <div class="form-group">
            <label for="prime_location_name" class="form-label">Prime Location Name</label>
            <input type="text" class="form-control" name="prime_location_name" value="{{ parking_lot.prime_location_name }}" required>
        </div>
        <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" name="address" rows="2" required>{{ parking_lot.address }}</textarea>
        </div>
        <div class="form-group">
            <label for="pin_code" class="form-label">Pin Code</label>
            <input type="text" class="form-control" name="pin_code" pattern="\d{6}" value="{{ parking_lot.pin_code }}" required>
        </div>
        <div class="form-group">
            <label for="price_per_hour" class="form-label">Price per Hour (₹)</label>
            <input type="number" class="form-control" name="price_per_hour" min="0" step="0.1" value="{{ parking_lot.price_per_hour }}" required>
        </div>
        <div class="form-group">
            <label for="max_spots" class="form-label">Maximum No. of Spots</label>
            <input type="number" class="form-control" name="max_spots" min="1" value="{{ parking_lot.max_spots }}" required><br>
        </div>
        <div class="d-flex justify-content-center gap-5 mt-4">
            <button type="submit" class="btn btn-primary w-18">
                <i class="fa-solid fa-pen-to-square"></i>
                Edit
            </button>
            <a href="{{ url_for('admin') }}" class="btn btn-danger w-18">
                <i class="fa-solid fa-xmark"></i>
                Cancel
            </a>
        </div>
    </form>

{% endblock %}
