{% extends 'layout.html' %}

{% block title %}
    Add Parking Lot
{% endblock %}

{% block content %}

<h1 class="display-1">Add Parking Lot</h1>

    <form action="" class="form" method="post">
        <div class="form-group">
            <label for="prime_location_name" class="form-label">Prime Location Name</label>
            <input type="text" class="form-control" name="prime_location_name" required>
        </div>
        <div class="form-group">
            <label for="address" class="form-label">Address</label>
            <textarea class="form-control" name="address" rows="2" required></textarea>
        </div>
        <div class="form-group">
            <label for="pin_code" class="form-label">Pin Code</label>
            <input type="text" class="form-control" name="pin_code" pattern="\d{6}" required>
        </div>
        <div class="form-group">
            <label for="price_per_hour" class="form-label">Price per Hour (₹)</label>
            <input type="number" class="form-control" name="price_per_hour" min="0" step="0.1" required>
        </div>
        <div class="form-group">
            <label for="max_spots" class="form-label">Maximum No. of Spots</label>
            <input type="number" class="form-control" name="max_spots" min="1" required><br>
        </div>
        <div class="d-flex justify-content-center gap-5 mt-4">
            <button type="submit" class="btn btn-success w-18">
            <i class="fa-solid fa-plus"></i>
            Add
            </button>
            <a href="{{ url_for('admin') }}" class="btn btn-primary w-18">
                <i class="fa-solid fa-xmark"></i>
                Cancel
            </a>
        </div>
    </form>

{% endblock %}
